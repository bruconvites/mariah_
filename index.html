<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9c9e0">
<title>Aniversário da Mariah - 2 anos</title>

<!--
  ============================================================
  ARQUIVOS QUE DEVEM FICAR NA MESMA PASTA DESTE index.html
  (se quiser usar outros nomes, altere só no bloco CONFIG abaixo)

    capa.jpg        -> primeira imagem (Clique no envelope para abrir)
    video.mp4       -> vídeo de introdução
    interativo.jpg  -> convite interativo
    presentes.jpg   -> sugestões de presente
  ============================================================
-->

<style>
  :root{
    --ratio: 941 / 1672;          /* proporção das imagens (9:16 aprox.) */
    --pink: #e0508f;
    --gold: #d9a441;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:linear-gradient(160deg,#fbd3e6,#f4c2dd 50%,#e9c9f2);
    font-family:"Georgia","Times New Roman",serif;
    -webkit-user-select:none; user-select:none;
  }

  /* ---------- Telas ---------- */
  .screen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden;
    transition:opacity .6s ease, visibility 0s linear .6s;
  }
  .screen.active{
    opacity:1; visibility:visible;
    transition:opacity .6s ease, visibility 0s;
  }

  /* palco com a proporção das imagens, sempre inteiro na tela */
  .stage{
    position:relative;
    height:100vh; height:100dvh;
    aspect-ratio: var(--ratio);
    max-width:100vw;
    max-height:calc(100vw / (941 / 1672));
    width:auto;
  }
  @supports not (aspect-ratio: 1){
    .stage{ width:min(100vw, calc(100vh * .5628)); height:calc(min(100vw, calc(100vh * .5628)) / .5628); }
  }
  .stage > img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; display:block;
    pointer-events:none; -webkit-user-drag:none;
  }

  #capa{ cursor:pointer; }
  #capa .stage::after{      /* leve pulsar convidando ao clique */
    content:""; position:absolute; left:14%; right:14%; top:71%; bottom:7%;
    border-radius:24px;
    animation:pulso 2.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulso{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,255,255,0); }
    50%    { box-shadow:0 0 38px 8px rgba(255,255,255,.55); }
  }

  /* ---------- Vídeo ---------- */
  #intro{ background:#000; }
  #intro video{
    width:100%; height:100%; object-fit:contain; background:#000;
  }

  /* ---------- Botões sutis ---------- */
  .soft-btn{
    position:absolute; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 26px);
    transform:translateX(-50%);
    padding:9px 22px;
    font:italic 400 15px/1 "Georgia","Times New Roman",serif;
    letter-spacing:.04em;
    color:#fff;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.55);
    border-radius:999px;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    text-shadow:0 1px 3px rgba(120,40,80,.55);
    box-shadow:0 2px 14px rgba(224,80,143,.25);
    cursor:pointer;
    opacity:0;
    transition:opacity .8s ease, background .25s ease, transform .25s ease;
    z-index:20;
    white-space:nowrap;
  }
  .soft-btn.show{ opacity:.85; }
  .soft-btn:hover{ background:rgba(255,255,255,.3); opacity:1; }
  .soft-btn:active{ transform:translateX(-50%) scale(.96); }
  .soft-btn:focus-visible{ outline:2px solid #fff; outline-offset:3px; }

  /* botão "voltar" sobre fundo rosa claro: tom rosado para ter leitura */
  .soft-btn.rosa{
    color:#b83a78;
    background:rgba(255,255,255,.55);
    border-color:rgba(217,164,65,.7);
    text-shadow:none;
    box-shadow:0 2px 14px rgba(224,80,143,.22);
  }
  .soft-btn.rosa:hover{ background:rgba(255,255,255,.8); }

  /* ---------- Áreas clicáveis do convite ---------- */
  .hotspot{
    position:absolute; display:block;
    border-radius:22px;
    cursor:pointer; z-index:10;
    transition:transform .2s ease, background .2s ease;
  }
  .hotspot:hover{ background:rgba(255,255,255,.14); }
  .hotspot:active{ transform:scale(.95); }
  .hotspot:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

  /* posição dos 3 botões da imagem interativo.jpg (em % da imagem) */
  #hs-local   { left:38%;   top:63.5%; width:19.5%; height:16%; }
  #hs-confirma{ left:57.5%; top:63.5%; width:19%;   height:16%; }
  #hs-presente{ left:76.5%; top:63.5%; width:19.5%; height:16%; }

  /* ---------- Cupcakes e brilhos ---------- */
  #fx{
    position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden;
  }
  #fx .p{
    position:absolute; left:0; top:0; will-change:transform, opacity;
    filter:drop-shadow(0 2px 3px rgba(200,70,130,.25));
  }
</style>
</head>
<body>

<!-- 1) CAPA -->
<section id="capa" class="screen active" aria-label="Capa do convite">
  <div class="stage"><img id="img-capa" alt="Clique no envelope para abrir"></div>
</section>

<!-- 2) VÍDEO -->
<section id="intro" class="screen" aria-label="Vídeo de introdução">
  <video id="video" playsinline webkit-playsinline preload="auto"></video>
  <button id="btn-pular" class="soft-btn" type="button">Pular introdução</button>
</section>

<!-- 3) CONVITE INTERATIVO -->
<section id="interativo" class="screen" aria-label="Convite">
  <div class="stage">
    <img id="img-interativo" alt="Convite de aniversário da Mariah - 2 anos">
    <a id="hs-local"    class="hotspot" target="_blank" rel="noopener" aria-label="Localização"></a>
    <a id="hs-confirma" class="hotspot" target="_blank" rel="noopener" aria-label="Confirmar presença"></a>
    <a id="hs-presente" class="hotspot" role="button" tabindex="0" aria-label="Sugestão de presente"></a>
  </div>
</section>

<!-- 4) SUGESTÕES DE PRESENTE -->
<section id="presentes" class="screen" aria-label="Sugestões de presente">
  <div class="stage">
    <img id="img-presentes" alt="Sugestões de presente da Mariah">
    <button id="btn-voltar" class="soft-btn rosa" type="button">Voltar ao convite</button>
  </div>
</section>

<!-- camada dos cupcakes -->
<div id="fx" aria-hidden="true"></div>

<script>
(function(){
  "use strict";

  /* ============ CONFIG ============ */
  var CONFIG = {
    capa:       "capa.jpg",
    video:      "video.mp4",
    interativo: "interativo.jpg",
    presentes:  "presentes.jpg",
    linkLocalizacao: "https://maps.app.goo.gl/P9No2zgeE5tzNkQe8",
    linkWhatsapp: "https://wa.me/5521986663020?text=%F0%9F%A7%81Ol%C3%A1!%20Quero%20confirmar%20presen%C3%A7a%20no%20anivers%C3%A1rio%20da%20Mariah.%20%F0%9F%A7%81%0A%0ASeremos%3A%0A%0A(___)%20ADULTOS%0A*Nomes%3A*%0A%0A(___)%20CRIAN%C3%87AS%0A*Nomes%20e%20idades%3A*"
  };
  /* ================================ */

  var $ = function(id){ return document.getElementById(id); };
  var screens = {
    capa: $("capa"), intro: $("intro"),
    interativo: $("interativo"), presentes: $("presentes")
  };
  var video = $("video"), btnPular = $("btn-pular"), btnVoltar = $("btn-voltar");
  var current = "capa", skipTimer = null, backTimer = null;

  /* carrega imagens / links */
  $("img-capa").src       = CONFIG.capa;
  $("img-interativo").src = CONFIG.interativo;
  $("img-presentes").src  = CONFIG.presentes;
  $("hs-local").href      = CONFIG.linkLocalizacao;
  $("hs-confirma").href   = CONFIG.linkWhatsapp;

  /* ---------- navegação entre telas ---------- */
  function show(name){
    current = name;
    for (var k in screens) screens[k].classList.toggle("active", k === name);

    btnPular.classList.remove("show");
    btnVoltar.classList.remove("show");
    clearTimeout(skipTimer); clearTimeout(backTimer);

    if (name === "intro"){
      skipTimer = setTimeout(function(){ btnPular.classList.add("show"); }, 1200);
    }
    if (name === "presentes"){
      backTimer = setTimeout(function(){ btnVoltar.classList.add("show"); }, 700);
    }
    if (name !== "intro"){ try { video.pause(); } catch(e){} }
  }

  /* ---------- capa -> vídeo ---------- */
  var videoStarted = false;
  function startVideo(){
    if (videoStarted) return;
    videoStarted = true;
    video.src = CONFIG.video;
    show("intro");
    var p = video.play();
    if (p && p.catch){
      p.catch(function(){
        video.muted = true;               // alguns navegadores exigem mudo
        video.play().catch(function(){ goInteractive(); });
      });
    }
  }
  screens.capa.addEventListener("click", startVideo);

  /* ---------- vídeo -> convite ---------- */
  function goInteractive(){ show("interativo"); }
  video.addEventListener("ended", goInteractive);
  video.addEventListener("error", goInteractive);   // se o vídeo não carregar, segue o convite
  btnPular.addEventListener("click", goInteractive);

  /* ---------- convite -> presentes -> convite ---------- */
  function goGifts(e){ if (e) e.preventDefault(); show("presentes"); }
  $("hs-presente").addEventListener("click", goGifts);
  $("hs-presente").addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " ") goGifts(e);
  });
  btnVoltar.addEventListener("click", goInteractive);

  /* ============================================================
     CUPCAKES FOFINHOS + BRILHINHOS
     ============================================================ */
  var fx = $("fx");
  var frostings = [
    ["#ffb6d5","#ff8fbd"], ["#e3c4ff","#c99bf5"], ["#b9e4ff","#8ccdf5"],
    ["#fff0d9","#ffd9a8"], ["#ffc9d9","#ff9fba"]
  ];
  var liners = [["#f7d27a","#e8b64f"], ["#ffc1d3","#f59ab6"], ["#d9c2ff","#bc9cf2"]];
  var sprinkleCols = ["#ff7eb0","#ffd166","#7ed3ff","#b69cff","#ffffff"];

  function rnd(a,b){ return a + Math.random()*(b-a); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  function cupcakeSVG(){
    var f = pick(frostings), l = pick(liners), s = "";
    for (var i=0;i<4;i++){
      s += '<rect x="'+rnd(11,25).toFixed(1)+'" y="'+rnd(10,19).toFixed(1)+'" width="3" height="1.4" rx=".7" '+
           'transform="rotate('+Math.round(rnd(-60,60))+' 18 15)" fill="'+pick(sprinkleCols)+'"/>';
    }
    return '' +
    '<svg width="100%" height="100%" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">' +
      /* forminha */
      '<path d="M8 22 L28 22 L25.5 33 Q25.2 34.5 23.6 34.5 L12.4 34.5 Q10.8 34.5 10.5 33 Z" fill="'+l[0]+'"/>' +
      '<path d="M13 22.5 L14 34 M18 22.5 L18 34 M23 22.5 L22 34" stroke="'+l[1]+'" stroke-width="1" stroke-linecap="round"/>' +
      /* glacê em camadas */
      '<path d="M6.5 22.5 Q5 17.5 9.5 16.2 Q9 11.5 14 11 Q15 6.5 19.5 7.5 Q24 7 24.5 11.5 Q29.5 12 28.5 16.5 Q31.5 18.5 29.5 22.5 Z" fill="'+f[0]+'"/>' +
      '<path d="M9.5 16.2 Q16 19 28.5 16.5 M14 11 Q19 14 24.5 11.5" stroke="'+f[1]+'" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".75"/>' +
      s +
      /* carinha */
      '<circle cx="14.2" cy="26.2" r="1.25" fill="#7a3b5a"/>' +
      '<circle cx="21.8" cy="26.2" r="1.25" fill="#7a3b5a"/>' +
      '<path d="M16.4 28 Q18 29.6 19.6 28" stroke="#7a3b5a" stroke-width="1" fill="none" stroke-linecap="round"/>' +
      '<ellipse cx="11.6" cy="28" rx="1.7" ry="1" fill="#ff7eb0" opacity=".55"/>' +
      '<ellipse cx="24.4" cy="28" rx="1.7" ry="1" fill="#ff7eb0" opacity=".55"/>' +
      /* cerejinha */
      '<circle cx="19.5" cy="6.2" r="2.4" fill="#ff5c8a"/>' +
      '<circle cx="18.7" cy="5.4" r=".7" fill="#fff" opacity=".8"/>' +
      '<path d="M19.6 3.9 Q20.6 2 22.2 1.6" stroke="#5fae6b" stroke-width="1" fill="none" stroke-linecap="round"/>' +
    '</svg>';
  }

  function sparkleSVG(col){
    return '<svg width="100%" height="100%" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M10 0 Q11 9 20 10 Q11 11 10 20 Q9 11 0 10 Q9 9 10 0Z" fill="'+col+'"/></svg>';
  }

  function spawn(html, x, y, size, dx, dy, rot, dur, delay, startScale){
    var el = document.createElement("div");
    el.className = "p";
    el.style.width = el.style.height = size + "px";
    el.style.marginLeft = el.style.marginTop = (-size/2) + "px";
    el.innerHTML = html;
    fx.appendChild(el);

    var done = function(){ if (el.parentNode) el.parentNode.removeChild(el); };
    if (!el.animate){ setTimeout(done, 50); return; }

    var anim = el.animate([
      { transform:"translate("+x+"px,"+y+"px) scale("+startScale+") rotate(0deg)", opacity:0 },
      { transform:"translate("+(x+dx*.35)+"px,"+(y+dy*.45)+"px) scale(1) rotate("+(rot*.4)+"deg)", opacity:1, offset:.25 },
      { transform:"translate("+(x+dx)+"px,"+(y+dy-30)+"px) scale(.85) rotate("+rot+"deg)", opacity:0 }
    ], { duration:dur, delay:delay, easing:"cubic-bezier(.2,.7,.3,1)", fill:"both" });
    anim.onfinish = done;
  }

  var sparkCols = ["#ffffff","#ffe08a","#ffc2dd","#d9c2ff"];

  function burst(x, y){
    var n = 5 + Math.floor(Math.random()*3);          // 5 a 7 cupcakes
    for (var i=0;i<n;i++){
      var ang = rnd(-Math.PI*0.95, -Math.PI*0.05);    // espalha para cima
      var dist = rnd(50, 120);
      spawn(cupcakeSVG(), x, y, rnd(24, 36),
            Math.cos(ang)*dist, Math.sin(ang)*dist + rnd(-10,25),
            rnd(-40,40), rnd(1000,1500), rnd(0,120), .2);
    }
    var m = 9 + Math.floor(Math.random()*5);          // brilhinhos
    for (var j=0;j<m;j++){
      var a2 = rnd(0, Math.PI*2), d2 = rnd(25, 105);
      spawn(sparkleSVG(pick(sparkCols)), x, y, rnd(8, 16),
            Math.cos(a2)*d2, Math.sin(a2)*d2 - 15,
            rnd(-90,90), rnd(700,1200), rnd(0,220), .1);
    }
  }

  var lastBurst = 0;
  document.addEventListener("pointerdown", function(e){
    var now = Date.now();
    if (now - lastBurst < 60) return;                 // evita excesso em multitoque
    lastBurst = now;
    burst(e.clientX, e.clientY);
  }, { passive:true });

  /* pré-carrega as imagens seguintes para a troca ser instantânea */
  [CONFIG.interativo, CONFIG.presentes].forEach(function(src){ var i = new Image(); i.src = src; });
})();
</script>
</body>
</html>
